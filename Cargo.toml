[package]
name = "language-learning"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Terminal app for intensive English listening practice with spaced-repetition review"
license = "MIT"

[[bin]]
name = "listen"
path = "src/main.rs"

[features]
default = ["audio"]
audio = ["dep:rodio"]

[dependencies]
dirs = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }

[profile.release]
strip = true
lto = "thin"
